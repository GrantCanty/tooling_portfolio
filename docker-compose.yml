services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./router/litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    env_file:
      - ./backend/.env

  backend:
    build: ./backend
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app
      - ./storage:/storage
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_PROXY_URL=http://litellm:4000
    depends_on:
      - litellm

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8888
    depends_on:
      - backend
